<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Cartão Perfil</title>
</head>
<body>
    <header class="flex justify-center  bg-white">
        <main class="p-6 max-h-[1000px] rounded-lg shadow-lg max-w-[500px] flex flex-col items-center"> 
            <img src="foto-perfil.jpg" class="w-[200px] mb-[50px] justify-center rounded-full border-4 border-gray-200" alt="Foto de perfil">
            <h1 class="text-center">Felipe G. de March dos Santos</h1>
            <p class="text-center italic">Estudante de Desenvolvimento de Sistemas</p>
            <div class="bg-blue-600 mt-[20px] rounded-full shadow-sm px-6 py-3">
                <p class="text-center text-white">Fale Comigo</p>
            </div>
            <footer class="flex items-center gap-6 mt-4">
                <img src="INSTAGRAM.png" class="w-10" alt="Logo do Instagram">
                <img src="linkedin.png" class="w-10" alt="Logo do LinkedIn">
                <img src="github.png" class="w-10" alt="Logo do GitHub">
            </footer>
        </main>
    </header>
</body>
</html>
